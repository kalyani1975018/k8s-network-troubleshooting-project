apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: test-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:1.27-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: test-ns
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80