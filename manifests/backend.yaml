apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: test-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: kalyani91/javaapp:latest
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: test-ns
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 8080